<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact Us | Nirdhara Overseas</title>
    <meta name="description"
        content="Request a quotation or ask a question. Importers, distributors and HoReCa buyers welcome.">
    <link rel="canonical" href="https://nirdhara.co.in/contact">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nirdhara Overseas">
    <meta property="og:title" content="Contact Us | Nirdhara Overseas">
    <meta property="og:description"
        content="Request a quotation or ask a question. Importers, distributors and HoReCa buyers welcome.">
    <meta property="og:url" content="https://nirdhara.co.in/contact">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#3A1D45">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%233A1D45%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23E3A008%27/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="site-header"></div>
    <main id="main">
        <section class="page-hero">
            <div class="wrap">
                <h1>Contact Us</h1>
                <p>Request a quotation or ask a question. Importers, distributors and HoReCa buyers welcome.</p>
            </div>
        </section>
        <section class="section">
            <div class="wrap contact-grid">
                <div id="quote">
                    <h2>Request a quote</h2>
                    <form id="quote-form" novalidate>
                        <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1"
                                    autocomplete="off"></label></div>
                        <div class="row2">
                            <div class="field"><label for="name">Your name<span class="req"
                                        aria-hidden="true">*</span></label><input id="name" name="name"
                                    autocomplete="name" required>
                                <div class="err" id="name-err"></div>
                            </div>
                            <div class="field"><label for="company">Company</label><input id="company" name="company"
                                    autocomplete="organization">
                                <div class="err" id="company-err"></div>
                            </div>
                        </div>
                        <div class="row2">
                            <div class="field"><label for="email">Email<span class="req"
                                        aria-hidden="true">*</span></label><input id="email" name="email" type="email"
                                    autocomplete="email" required>
                                <div class="err" id="email-err"></div>
                            </div>
                            <div class="field"><label for="country">Country<span class="req"
                                        aria-hidden="true">*</span></label><input id="country" name="country"
                                    autocomplete="country-name" required>
                                <div class="err" id="country-err"></div>
                            </div>
                        </div>
                        <div class="field"><label for="phone">Phone or WhatsApp</label><input id="phone" name="phone"
                                type="tel" autocomplete="tel"></div>
                        <div class="field"><label for="product">Product<span class="req"
                                    aria-hidden="true">*</span></label><select id="product" name="product" required>
                                <option value="">Choose a product</option>
                                <option value="onion">Dehydrated Onion</option>
                                <option value="garlic">Dehydrated Garlic</option>
                                <option value="horeca">All-in-one Ingredient Basket</option>
                                <option value="custom">List what you need</option>
                            </select>
                            <div class="err" id="product-err"></div>
                        </div>
                        <div class="field" id="need-field" hidden><label for="need">What do you need?<span class="req"
                                    aria-hidden="true">*</span></label><textarea id="need" name="need" rows="3"
                                placeholder="Tell us the product(s) you need"></textarea>
                            <div class="err" id="need-err"></div>
                        </div>
                        <div class="field"><label for="message">Form, quantity and destination<span class="req"
                                    aria-hidden="true">*</span></label><textarea id="message" name="message" rows="5"
                                required></textarea>
                            <div class="err" id="message-err"></div>
                        </div>
                        <button class="btn btn-dark" type="submit">Send enquiry</button>
                        <p id="form-status" role="status" style="margin-top:1rem"></p>
                    </form>
                </div>
                <aside class="stack">
                    <h2>Get in touch</h2>
                    <p><strong>Email</strong><br>contact@nirdhara.co.in</p>
                    <p><strong>Phone</strong><br>+91 9039229820 <br> +91 8319964787</p>
                    <p><strong>Address</strong><br>Narmadapuram, <br> Madhya Pradesh (461001)</p>
                </aside>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script defer src="assets/js/data.js"></script>
    <script defer src="assets/js/main.js"></script>
    <script defer src="assets/js/forms.js"></script>
</body>

</html>
